<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 540" role="img" aria-label="Avrupa Birliği">
  <!-- Avrupa Birliği amblemi, resmî oranlarda: bayrak 3:2, yıldız çemberinin
       yarıçapı bayrak yüksekliğinin 1/3'ü (180), her yıldızın çevrel çember
       yarıçapı yüksekliğin 1/18'i (30). Yıldızlar dik durur ve saat kadranı
       düzeninde dizilir.

       "Avrupa Birliği tarafından finanse edilmektedir" ibaresi görsele
       GÖMÜLMEDİ: çok dilli sitede ibare sayfa diliyle değişmeli, bu yüzden
       sözlükten (locales/*.json) amblemin yanına yazılır. -->
  <defs>
    <!-- Beş köşeli yıldız: dış yarıçap 30, iç yarıçap 30 × 0.382. -->
    <polygon id="ab-yildiz" fill="#FC0"
      points="0,-30 6.74,-9.27 28.53,-9.27 10.90,3.54 17.63,24.27 0,11.46 -17.63,24.27 -10.90,3.54 -28.53,-9.27 -6.74,-9.27"/>
  </defs>
  <rect width="810" height="540" fill="#039"/>
  <use href="#ab-yildiz" x="405" y="90"/>
  <use href="#ab-yildiz" x="495" y="114.12"/>
  <use href="#ab-yildiz" x="561" y="180"/>
  <use href="#ab-yildiz" x="585" y="270"/>
  <use href="#ab-yildiz" x="561" y="360"/>
  <use href="#ab-yildiz" x="495" y="425.88"/>
  <use href="#ab-yildiz" x="405" y="450"/>
  <use href="#ab-yildiz" x="315" y="425.88"/>
  <use href="#ab-yildiz" x="249" y="360"/>
  <use href="#ab-yildiz" x="225" y="270"/>
  <use href="#ab-yildiz" x="249" y="180"/>
  <use href="#ab-yildiz" x="315" y="114.12"/>
</svg>
