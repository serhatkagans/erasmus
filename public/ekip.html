<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Ekipler ve Görevler · E-YOUTHPRENEUR</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
<script src="ekip.js" type="module"></script>
</head>
<body data-t-sayfa="ekip.baslik">

<a class="atla" href="#icerik" data-t="menu.atla"></a>

<header class="ust">
  <div class="kapsayici ust-ic">
    <a class="marka" href="./">
      <img src="logo.png" alt="">
      <span>E-YOUTHPRENEUR <small data-t="altbilgi.kunye"></small></span>
    </a>
    <!-- Menü ortak.js'te tek listeden kurulur (menuyuKur): her sayfada aynı. -->
    <nav class="gezinme" id="gezinme" data-t-etiket="menu.ana"></nav>
    <div class="ust-sag">
      <span id="kullanici-adi" class="kullanici-rozet" hidden></span>
      <span id="hatirlatici" class="hatirlatici" hidden></span>
      <div id="dil-secici" class="dil-secici" hidden></div>
      <button id="parola-dugme" class="dugme dugme-hayalet" hidden data-t="menu.parola"></button>
      <a id="giris-baglanti" class="dugme dugme-hayalet" href="giris.html" data-t="menu.giris"></a>
      <button id="cikis-dugme" class="dugme dugme-hayalet" hidden data-t="menu.cikis"></button>
    </div>
  </div>
</header>

<main id="icerik">
  <section class="kapsayici sayfa-bas">
    <span class="ustbaslik" data-t="ekip.ustbaslik"></span>
    <h1 data-t="ekip.baslik"></h1>
    <p data-t="ekip.giris"></p>
    <div class="kahraman-dugmeler">
      <button id="gorev-ekle" class="dugme dugme-birincil" hidden data-t="gorev.ekle"></button>
      <button id="uye-ekle" class="dugme dugme-ikincil" hidden data-t="ekip.uye.ekle"></button>
    </div>
  </section>

  <div class="kapsayici">
    <div id="kurumlar" class="kurum-listesi"></div>
  </div>
</main>

<footer class="alt">
  <div class="kapsayici alt-ic">
    <div class="alt-ust">
      <span class="marka"><img src="logo.png" alt=""><span>E-YOUTHPRENEUR</span></span>
      <div class="ab-kilit">
        <img src="ab-amblem.svg" data-t-etiket="ab.amblem" alt="">
        <span data-t="ab.finanse"></span>
      </div>
    </div>
    <div class="alt-kunye">
      <span data-t="altbilgi.program"></span>
      <span data-t="altbilgi.projeno"></span>
      <span data-t="altbilgi.sure"></span>
      <span data-t="altbilgi.ajans"></span>
    </div>
    <p class="alt-erisim" data-t="altbilgi.erisim"></p>
    <p class="alt-feragat" data-t="altbilgi.feragat"></p>
  </div>
</footer>

<dialog id="uye-kutu">
  <form id="uye-form" class="kutu-ic">
    <div class="kutu-ust">
      <h2 id="uye-form-baslik"></h2>
      <button type="button" class="kapat" data-kapat aria-label="Kapat">×</button>
    </div>
    <div class="form-izgara">
      <label class="alan form-tam"><span data-t="ekip.uye.ad"></span><input name="ad" maxlength="120" required></label>
      <label class="alan"><span data-t="gorev.kurum"></span><select name="partner"></select></label>
      <label class="alan"><span data-t="ekip.uye.rol"></span><input name="rol" maxlength="120"></label>
      <label class="alan form-tam"><span data-t="ekip.uye.eposta"></span><input name="eposta" type="email" maxlength="200"></label>
    </div>
    <p class="hata" id="uye-hata" role="alert"></p>
    <div class="kutu-eylem">
      <button type="submit" class="dugme dugme-birincil" data-t="genel.kaydet"></button>
      <button type="button" class="dugme dugme-ikincil" data-kapat data-t="genel.vazgec"></button>
    </div>
  </form>
</dialog>

<dialog id="gorev-kutu">
  <form id="gorev-form" class="kutu-ic">
    <div class="kutu-ust">
      <h2 id="gorev-form-baslik"></h2>
      <button type="button" class="kapat" data-kapat aria-label="Kapat">×</button>
    </div>
    <div class="form-izgara">
      <label class="alan form-tam"><span data-t="gorev.ad"></span><input name="baslik" maxlength="200" required></label>
      <label class="alan"><span data-t="gorev.kurum"></span><select name="partner"></select></label>
      <label class="alan"><span data-t="gorev.kisi"></span><select name="uyeId"></select></label>
      <label class="alan"><span data-t="takvim.filtre.ispaketi"></span><select name="wp"></select></label>
      <label class="alan"><span data-t="gorev.sontarih"></span><input name="sonTarih" type="date"></label>
      <label class="alan"><span data-t="etkinlik.durum"></span><select name="durum"></select></label>
      <label class="alan"><span data-t="gorev.ilerleme"></span>
        <span class="gorev-ilerleme"><input name="ilerleme" type="range" min="0" max="100" step="10" value="0" class="gorev-kaydirici"><output id="gorev-ilerleme-cikti" class="gorev-yuzde">%0</output></span>
      </label>
      <label class="alan form-tam"><span data-t="gorev.etkinlik"></span><select name="etkinlikId"></select></label>
      <label class="alan form-tam"><span data-t="gorev.aciklama"></span><textarea name="aciklama" maxlength="4000"></textarea></label>
    </div>
    <p class="hata" id="gorev-hata" role="alert"></p>
    <div class="kutu-eylem">
      <button type="submit" class="dugme dugme-birincil" data-t="genel.kaydet"></button>
      <button type="button" class="dugme dugme-ikincil" data-kapat data-t="genel.vazgec"></button>
    </div>
  </form>
</dialog>

</body>
</html>
