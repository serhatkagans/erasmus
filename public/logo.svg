  </defs>
  <rect width="64" height="64" rx="15" fill="url(#g)"/>
  <path d="M44 17c0 14-9 23-21 23-2.6 0-4.6-.4-6-1 2-11 10-18 21-19 2.4-.2 4.4-1.4 6-3z"
